name: Supply Radar V2 Data Sync

on:
  schedule:
    - cron: "17,47 * * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: supply-radar-v2-data-sync
  cancel-in-progress: false

defaults:
  run:
    working-directory: v2-web

jobs:
  sync:
    name: Sync ${{ matrix.feed }}
    strategy:
      fail-fast: false
      matrix:
        feed: [legacy, account-opportunity-archive, priceai]
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      SUPABASE_URL: ${{ vars.NEXT_PUBLIC_SUPABASE_URL }}
      SUPABASE_ANON_KEY: ${{ secrets.NEXT_PUBLIC_SUPABASE_ANON_KEY }}
      SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
      LEGACY_RADAR_API_URL: https://aivora-supply-radar.sabrinamisan090.workers.dev
      PRICEAI_API_URL: https://priceai.cc
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.34.5
          run_install: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: v2-web/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - name: Sync independent feed
        run: pnpm import:${{ matrix.feed }}
        env:
          PRICEAI_SNAPSHOT_CACHE_DIR: ${{ runner.temp }}/aivora-priceai-snapshot
  audit:
    needs: sync
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      SUPABASE_URL: ${{ vars.NEXT_PUBLIC_SUPABASE_URL }}
      SUPABASE_ANON_KEY: ${{ secrets.NEXT_PUBLIC_SUPABASE_ANON_KEY }}
      SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.34.5
          run_install: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: pnpm install --frozen-lockfile
      - run: pnpm audit:data
