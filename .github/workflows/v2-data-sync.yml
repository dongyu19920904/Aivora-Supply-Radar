name: Supply Radar V2 Data Sync

on:
  schedule:
    - cron: "17,47 * * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: supply-radar-v2-data-sync
  cancel-in-progress: false

defaults:
  run:
    working-directory: v2-web

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      SUPABASE_URL: ${{ vars.NEXT_PUBLIC_SUPABASE_URL }}
      SUPABASE_ANON_KEY: ${{ secrets.NEXT_PUBLIC_SUPABASE_ANON_KEY }}
      SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
      LEGACY_RADAR_API_URL: https://supply.aivora.cn
      PRICEAI_API_URL: https://priceai.cc
      PRICEAI_SNAPSHOT_CACHE_DIR: ${{ runner.temp }}/aivora-priceai-snapshot
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.34.5
          run_install: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: v2-web/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - name: Sync verified Aivora V1 baseline
        run: pnpm import:legacy
      - name: Sync authorized PriceAI snapshot
        run: pnpm import:priceai
      - name: Audit the published dataset
        run: pnpm audit:data
